name: ③ TikTokの所有権確認ファイルを置く

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'TikTokでダウンロードしたファイルの名前（例: tiktokAbCd123.txt）'
        required: true
      content:
        description: 'そのファイルの中身（テキストをそのまま貼り付け）'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ファイルを置く
        env:
          FNAME: ${{ github.event.inputs.filename }}
          BODY: ${{ github.event.inputs.content }}
        run: |
          case "$FNAME" in */*|*..*|"") echo "ファイル名が正しくありません"; exit 1;; esac
          printf '%s' "$BODY" > "docs/$FNAME"
          git config user.name "carousel-bot"
          git config user.email "carousel-bot@users.noreply.github.com"
          git add "docs/$FNAME"
          git diff --cached --quiet || git commit -m "add TikTok verification file"
          git push
  site:
    needs: add
    uses: ./.github/workflows/_deploy-site.yml
    secrets: inherit
