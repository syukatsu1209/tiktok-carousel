name: ② TikTokと連携

on:
  workflow_dispatch:
    inputs:
      code:
        description: '連携ページに表示されたコード'
        required: true

permissions:
  contents: write
  pages: read

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q cryptography
      - name: コードをトークンに交換して保存
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ github.event.inputs.code }}
        run: |
          echo "::add-mask::$CODE"
          BASE=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url)
          REDIRECT="${BASE%/}/auth/"
          echo "リダイレクトURI: $REDIRECT"
          cd tiktok && python exchange_code.py "$CODE" "$REDIRECT"
      - name: 暗号化したトークンを保存
        run: |
          git config user.name "carousel-bot"
          git config user.email "carousel-bot@users.noreply.github.com"
          git add tiktok/token.enc
          git commit -m "link TikTok account"
          git push
